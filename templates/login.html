{% extends 'layout.html' %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Přihlášení</h1>
        <form method="POST" action="">
          <div class="mb-3">
            <label>Jméno</label>
            <input type="text" name="name" class="form-control" value="{{request.form.name}}" autocomplete="username">
          </div>
          <div class="mb-3">
            <label>Heslo</label>
            <input type="password" name="password" class="form-control" value="{{request.form.password}}"
              autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Přihlásit</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
