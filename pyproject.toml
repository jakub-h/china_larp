[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china_larp"
version = "0.1.0"
description = "Flask web app for a LARP inspired by the Chinese social credit system."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jakub Hruška" }]
dependencies = [
  "flask>=3.0,<4",
  "segno>=1.6,<2",
  "tinydb>=4.8,<5",
  "wtforms>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pre-commit",
  "ruff",
]

[tool.setuptools]
py-modules = ["app", "citizen", "utils"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
